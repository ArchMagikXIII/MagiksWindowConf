<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link rel="stylesheet" type="text/css" href="./wallpaper-colors.css" />
    <script src="./gpu-info.js"></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu', refreshInterval: 2000 },
        memory: { type: 'memory', refreshInterval: 5000 },
        network: { type: 'network', refreshInterval: 5000 },
        battery: { type: 'battery', refreshInterval: 10000 },
        audio: { type: 'audio' },
        date: { type: 'date', formatting: 'EEE MMM dd  hh:mm tt', refreshInterval: 1000 },
      });

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
        }, []);

        const workspaceIcons = {
          '1': <i className="nf nf-md-console"></i>,
          '2': <i className="nf nf-md-monitor"></i>,
          '3': <i className="nf nf-md-folder"></i>,
          '4': <i className="nf nf-md-application"></i>,
          '5': <i className="nf nf-md-email"></i>,
        };

        function getNetworkIcon() {
          const iface = output.network?.defaultInterface;
          if (!iface) return <i className="nf nf-md-wifi_strength_off_outline"></i>;
          switch (iface.type) {
            case 'wifi':
              return <i className="nf nf-md-wifi"></i>;
            case 'ethernet':
              return <i className="nf nf-md-ethernet_cable"></i>;
            default:
              return <i className="nf nf-md-wifi_strength_off_outline"></i>;
          }
        }

        function getAudioIcon() {
          const dev = output.audio?.defaultPlaybackDevice;
          if (!dev) return <i className="nf nf-md-volume_off"></i>;
          if (dev.isMuted || dev.volume === 0) return <i className="nf nf-md-volume_off"></i>;
          if (dev.volume < 33) return <i className="nf nf-md-volume_low"></i>;
          if (dev.volume < 66) return <i className="nf nf-md-volume_medium"></i>;
          return <i className="nf nf-md-volume_high"></i>;
        }

        function getBatteryIcon() {
          const pct = output.battery?.chargePercent;
          if (pct === undefined || pct === null) return null;
          if (output.battery?.isCharging) return <i className="nf nf-md-battery_charging_80"></i>;
          if (pct > 90) return <i className="nf nf-md-battery"></i>;
          if (pct > 70) return <i className="nf nf-md-battery_80"></i>;
          if (pct > 40) return <i className="nf nf-md-battery_50"></i>;
          if (pct > 20) return <i className="nf nf-md-battery_30"></i>;
          return <i className="nf nf-md-battery_10"></i>;
        }

        function getGpuNames() {
          const gpus = window.__GPU_LIST__;
          if (!gpus || gpus.length === 0) return ['GPU'];
          return gpus;
        }

        function getPrimaryGpu() {
          const gpus = getGpuNames();
          return gpus[gpus.length - 1] || 'GPU';
        }

        function getGpuClickCmd() {
          const gpu = getPrimaryGpu().toLowerCase();
          if (gpu.includes('nvidia')) return 'shell-exec "C:\\Program Files\\NVIDIA Corporation\\NVSMI\\nvidia-smi.exe"';
          if (gpu.includes('amd') || gpu.includes('radeon')) return 'shell-exec "C:\\Program Files\\AMD\\CNext\\CNext\\RadeonSoftware.exe"';
          return 'shell-exec ms-settings:display';
        }

        function shellExec(cmd) {
          output.glazewm?.runCommand(`shell-exec ${cmd}`);
        }

        return (
          <div className="app">
            <div className="left">
              {output.glazewm && (
                <div className="workspaces">
                  {output.glazewm.currentWorkspaces.map(workspace => (
                    <button
                      className={`workspace ${workspace.hasFocus ? 'focused' : ''}`}
                      onClick={() =>
                        output.glazewm.runCommand(`focus --workspace ${workspace.name}`)
                      }
                      key={workspace.name}
                    >
                      {workspaceIcons[workspace.name] ?? workspace.displayName ?? workspace.name}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="center">
              <span className="logo">{'\u2B22'} MagikXIII</span>
              <div
                className="clock clickable"
                onClick={() => shellExec('ms-settings:dateandtime')}
              >
                {output.date?.formatted}
              </div>
            </div>

            <div className="right">
              {output.cpu && (
                <div
                  className="module cpu clickable"
                  onClick={() => shellExec('taskmgr.exe')}
                >
                  <i className="nf nf-md-cpu_64_bit"></i>
                  {Math.round(output.cpu.usage)}%
                </div>
              )}

              {output.memory && (
                <div
                  className="module memory clickable"
                  onClick={() => shellExec('taskmgr.exe')}
                >
                  <i className="nf nf-md-memory"></i>
                  {Math.round(output.memory.usage)}%
                </div>
              )}

              <div
                className="module gpu clickable"
                onClick={() => shellExec(getGpuClickCmd())}
              >
                <i className="nf nf-md-video_account"></i>
                {getPrimaryGpu()}
              </div>

              {output.network && (
                <div
                  className="module network clickable"
                  onClick={() => shellExec('ms-settings:network-status')}
                >
                  {getNetworkIcon()}
                </div>
              )}

              {output.audio?.defaultPlaybackDevice && (
                <div
                  className="module audio clickable"
                  onClick={() => shellExec('ms-settings:sound')}
                >
                  {getAudioIcon()}
                  {output.audio.defaultPlaybackDevice.isMuted ? '0' : output.audio.defaultPlaybackDevice.volume}%
                </div>
              )}

              {output.audio?.defaultPlaybackDevice && (
                <div className="audio-slider">
                  <input
                    type="range"
                    min="0"
                    max="100"
                    step="2"
                    value={output.audio.defaultPlaybackDevice.isMuted ? 0 : output.audio.defaultPlaybackDevice.volume}
                    onChange={e => {
                      const val = e.target.valueAsNumber;
                      output.audio.setVolume(val);
                      if (val > 0 && output.audio.defaultPlaybackDevice.isMuted) {
                        output.audio.setMute(false);
                      }
                    }}
                  />
                </div>
              )}

              {output.battery && (
                <div
                  className="module battery clickable"
                  onClick={() => shellExec('ms-settings:batterysaver')}
                >
                  {getBatteryIcon()}
                  {Math.round(output.battery.chargePercent)}%
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
